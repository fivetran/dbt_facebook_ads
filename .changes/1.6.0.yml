version: 1.6.0
schema_data_changes:
  entries:
  - models:
    - '[facebook_ads__age_gender_report](https://fivetran.github.io/dbt_facebook_ads/#!/model/model.facebook_ads.facebook_ads__age_gender_report)'
    change_type: New model
    is_breaking: false
    notes: Daily account performance and conversions by audience age range and gender.
      Built from the `DEMOGRAPHICS_AGE_AND_GENDER` and `DEMOGRAPHICS_AGE_AND_GENDER_ACTIONS`
      source tables. Dynamically enabled in Quickstart; disabled by default otherwise.
      To enable in self-managed dbt projects, set the `facebook_ads__using_demographics_age_and_gender`
      variable to `true`.
  - models:
    - '[stg_facebook_ads__demographics_age_and_gender](https://fivetran.github.io/dbt_facebook_ads/#!/model/model.facebook_ads.stg_facebook_ads__demographics_age_and_gender)'
    - '[stg_facebook_ads__demographics_age_and_gender_actions](https://fivetran.github.io/dbt_facebook_ads/#!/model/model.facebook_ads.stg_facebook_ads__demographics_age_and_gender_actions)'
    - '[stg_facebook_ads__demographics_age_and_gender_tmp](https://fivetran.github.io/dbt_facebook_ads/#!/model/model.facebook_ads.stg_facebook_ads__demographics_age_and_gender_tmp)'
    - '[stg_facebook_ads__demographics_age_and_gender_actions_tmp](https://fivetran.github.io/dbt_facebook_ads/#!/model/model.facebook_ads.stg_facebook_ads__demographics_age_and_gender_actions_tmp)'
    change_type: New staging models
    is_breaking: false
    notes: Staging models to support age and gender reporting.
new_features:
- title: Age and gender reporting passthrough column variables
  description: Adds two new variables to pass additional or custom metrics through
    to the `facebook_ads__age_gender_report` model.
  details:
  - '`facebook_ads__demographics_age_and_gender_passthrough_metrics` passes additional
    `DEMOGRAPHICS_AGE_AND_GENDER` metrics through to `facebook_ads__age_gender_report`.'
  - '`facebook_ads__demographics_age_and_gender_actions_passthrough_metrics` passes
    additional `DEMOGRAPHICS_AGE_AND_GENDER_ACTIONS` metrics through to `facebook_ads__age_gender_report`.'
date: '2026-11-03'
